<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VedaVet Staff Portal</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#1c2a3d;font:14px 'Segoe UI',Arial,sans-serif}header{background:#07376e;color:white;padding:17px 25px;display:flex;justify-content:space-between;align-items:center}header strong{font-size:23px}header button{background:#fff;color:#07376e}button{border:0;border-radius:8px;padding:10px 14px;background:#07376e;color:white;cursor:pointer;font-weight:600}button:hover{opacity:.9}.layout{display:flex;min-height:88vh}aside{background:#fff;width:240px;flex-shrink:0;padding:18px;border-right:1px solid #dbe4ef}aside button{display:block;width:100%;margin:5px 0;text-align:left;background:#f4f7fb;color:#07376e}aside button.sel{background:#07376e;color:white}main{padding:26px;flex:1;min-width:0}h1{color:#07376e}.card{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:20px;margin:10px 0;box-shadow:0 2px 6px #10294809}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}.metric{font-size:27px;font-weight:bold;color:#07376e}.metric-text{font-size:17px!important;line-height:1.3;overflow-wrap:anywhere;padding-top:6px}input,select,textarea{width:100%;padding:10px;margin:4px 0 12px;border:1px solid #c9d3e3;border-radius:8px}label{font-size:13px;font-weight:600}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:600px}th,td{padding:11px 9px;text-align:left;border-bottom:1px solid #e6ebf2;vertical-align:top}th{color:#07376e}td{max-width:250px;overflow-wrap:anywhere}small,.muted{color:#66758a}.hidden{display:none!important}.danger{color:#b23a42}.pill{background:#e7f0ff;color:#07376e;border-radius:30px;padding:5px 9px}#login{width:min(440px,94%);margin:65px auto}pre{white-space:pre-wrap} @media(max-width:800px){.layout{display:block}aside{width:100%;display:flex;overflow:auto;gap:5px}aside button{flex-shrink:0;width:auto}main{padding:15px}.grid{grid-template-columns:1fr}}
</style><style id="vedavet-staff-brand">
