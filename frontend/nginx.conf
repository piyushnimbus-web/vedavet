server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Pages reference /beta/node/... (the VPS path). Strip it so local Docker runs resolve the same assets.
  location = /beta/node { return 301 /beta/node/; }
  location ^~ /beta/node/ { rewrite ^/beta/node/(.*)$ /$1 last; }
  location /api/ { proxy_pass http://backend:4000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
  location /staff/ { proxy_pass http://backend:4000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location / { try_files $uri $uri/ /index.html; }
}
